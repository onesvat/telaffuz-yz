[project]
name = "telaffuz-yz-thesis"
version = "0.1.0"
description = "Reproducible thesis repository for Turkish pronunciation assessment with G2P, wav2vec phoneme models, and a two-score coach runtime."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "accelerate>=1.13.0",
    "docxcompose>=2.1.0",
    "fastapi>=0.136.1",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "nlptoolkit-morphologicalanalysis>=1.0.52",
    "pandas>=3.0.3",
    "praat-parselmouth>=0.4.7",
    "pyarrow>=24.0.0",
    "python-multipart>=0.0.28",
    "scipy>=1.17.1",
    "setuptools<80",
    "soundfile>=0.13.1",
    "tensorboard>=2.20.0",
    "torch>=2.6,<2.7",
    "torchaudio>=2.6,<2.7",
    "tqdm>=4.67.3",
    "transformers>=4.51,<5",
    "uvicorn>=0.46.0",
]

[tool.uv]
cache-dir = ".uv-cache"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[project.scripts]
g2p = "g2p.cli:main"
g2p-eval = "g2p.evaluation:main"
api = "api.__main__:run_api"
dev = "api.__main__:run_dev"
audio = "audio.cli:main"
assess = "assess.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g2p", "src/audio", "src/api", "src/assess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:MorphologicalAnalysis",
    "ignore:pkg_resources is deprecated:DeprecationWarning",
]

[[tool.mypy.overrides]]
module = [
    "Corpus.*",
    "DataStructure.*",
    "Dictionary.*",
    "Math.*",
    "MorphologicalAnalysis.*",
    "Util.*",
    "librosa",
    "parselmouth",
    "parselmouth.*",
    "soundfile",
    "torchaudio",
    "torchaudio.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
